name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      # Needs the repository's dependency graph, which a fork does not inherit:
      # there the action hard-fails with "Dependency review is not supported on
      # this repository" and takes the whole run red — on `pull_request_target`,
      # which means a failure mail to the fork owner for every PR. Enabling the
      # graph on a fork would also turn on Dependabot alert mail for the entire
      # monorepo, so gate the step on the canonical repository instead, the
      # same `github.repository` check docker.yml uses for upstream-only steps.
      - name: Dependency Review
        if: github.repository == 'paperclipai/paperclip'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # The bot's private key is an organisation secret, so a fork has no way
      # to mint an installation token: `get-bot-token.mjs` exits 1 and the run
      # goes red on every PR. Decide once, in a step the key is scoped to, and
      # let the gates below skip rather than fail when it is absent.
      - name: Check for commitperclip credentials
        id: creds
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${COMMITPERCLIP_KEY:-}" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'COMMITPERCLIP_KEY is not available here, so the commitperclip review gates were skipped. The PR workflow still gates this pull request.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate commitperclip token
        id: token
        if: steps.creds.outputs.configured == 'true'
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT
        env:
          COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}

      - name: Run quality gates
        id: quality
        if: >-
          steps.creds.outputs.configured == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          steps.creds.outputs.configured == 'true' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
